name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: tools/graph-react-app

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/graph-react-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify clean tracked release source
        run: npm run check:release-source -- --revision "$GITHUB_SHA" --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

      - name: Audit locked npm dependencies and generate source SBOM
        run: |
          npm audit --audit-level=high
          mkdir -p "$RUNNER_TEMP/supply-chain"
          npm sbom --package-lock-only --sbom-format=cyclonedx > "$RUNNER_TEMP/supply-chain/npm.cdx.json"
          node -e '
            const { readFileSync } = require("node:fs");
            const sbom = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/supply-chain/npm.cdx.json", "utf8"));
            if (sbom.bomFormat !== "CycloneDX" || !Array.isArray(sbom.components) || sbom.components.length === 0) process.exit(1);
          '

      - name: Typecheck and source-policy gates
        run: npm run typecheck

      - name: Agent server tests (serial)
        run: node --import tsx --test --test-concurrency=1 ../agent-server/test/*.test.ts

      - name: Batch tool tests (serial)
        run: node --import tsx --test --test-concurrency=1 ../chatgpt_creature_image_batch_core.test.ts

      - name: Web and script tests (serial)
        run: node --import tsx --test --test-concurrency=1 src/agent/*.test.ts scripts/*.test.ts

      - name: Build container-mode web export
        run: npm run build:container

      - name: Remove host-generated web artifacts before image build
        working-directory: ${{ github.workspace }}
        run: |
          rm -f "00_总览/黑曜纪元3D世界地图.html" "00_总览/黑曜纪元3D世界地图.http.html"
          rm -rf "00_总览/assets" "00_总览/data"
          test ! -e "00_总览/黑曜纪元3D世界地图.html"
          test ! -e "00_总览/assets"
          test ! -e "00_总览/data"

      - name: Build production image
        working-directory: ${{ github.workspace }}
        run: |
          release_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          image_version="ci-${GITHUB_SHA::12}"
          docker build \
            --file tools/agent-server/deploy/Dockerfile \
            --tag obsidian-epoch-agent-server:ci \
            --build-arg "SOURCE_DATE_EPOCH=$release_epoch" \
            --build-arg "OCI_IMAGE_VERSION=$image_version" \
            --build-arg "OCI_IMAGE_REVISION=$GITHUB_SHA" \
            --build-arg "OCI_IMAGE_SOURCE=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            .

      - name: Build hardened non-root Caddy image
        working-directory: ${{ github.workspace }}
        run: |
          release_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          image_version="ci-${GITHUB_SHA::12}"
          docker build \
            --file tools/agent-server/deploy/Dockerfile.caddy \
            --tag obsidian-epoch-caddy:ci \
            --build-arg "SOURCE_DATE_EPOCH=$release_epoch" \
            --build-arg "OCI_IMAGE_VERSION=$image_version" \
            --build-arg "OCI_IMAGE_REVISION=$GITHUB_SHA" \
            --build-arg "OCI_IMAGE_SOURCE=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            .

      - name: Verify immutable image provenance labels
        working-directory: ${{ github.workspace }}
        run: |
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' obsidian-epoch-agent-server:ci)" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' obsidian-epoch-agent-server:ci)" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' obsidian-epoch-agent-server:ci)" = "ci-${GITHUB_SHA::12}"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' obsidian-epoch-caddy:ci)" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' obsidian-epoch-caddy:ci)" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' obsidian-epoch-caddy:ci)" = "ci-${GITHUB_SHA::12}"
          test "$(docker image inspect --format '{{.Config.User}}' obsidian-epoch-caddy:ci)" = "65532:65532"
          test "$(docker run --rm --entrypoint /usr/bin/caddy obsidian-epoch-caddy:ci version)" = "v2.11.4"

      - name: Generate image SBOMs and block high or critical vulnerabilities
        working-directory: ${{ github.workspace }}
        env:
          TRIVY_IMAGE: aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
        run: |
          docker volume create obsidian-epoch-trivy-cache
          for image in obsidian-epoch-agent-server:ci obsidian-epoch-caddy:ci; do
            artifact_name="${image%%:*}"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v obsidian-epoch-trivy-cache:/root/.cache/ \
              -v "$RUNNER_TEMP/supply-chain:/artifacts" \
              "$TRIVY_IMAGE" image --no-progress --format cyclonedx \
              --output "/artifacts/${artifact_name}.cdx.json" "$image"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v obsidian-epoch-trivy-cache:/root/.cache/ \
              "$TRIVY_IMAGE" image --no-progress --scanners vuln \
              --severity HIGH,CRITICAL --exit-code 1 "$image"
          done

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-${{ github.sha }}
          path: ${{ runner.temp }}/supply-chain/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify referenced console script in production image
        working-directory: ${{ github.workspace }}
        run: |
          docker run --rm --entrypoint /nodejs/bin/node obsidian-epoch-agent-server:ci --input-type=module -e '
            const { existsSync, readFileSync } = await import("node:fs");
            const root = "/app/00_总览";
            const html = readFileSync(`${root}/黑曜纪元3D世界地图.html`, "utf8");
            const script = html.match(/<script[^>]+src="\.\/assets\/([^"]+\.js)"/)?.[1];
            if (!script || !existsSync(`${root}/assets/${script}`)) {
              throw new Error(`missing referenced console script: ${script ?? "none"}`);
            }
            if (existsSync(`${root}/assets/media`)) throw new Error("runtime image must not contain console media");
            if (existsSync("/app/node_modules") || existsSync("/app/tools/graph-react-app")) {
              throw new Error("runtime image contains frontend build dependencies");
            }
            console.log(`verified console script: ${script}`);
          '

      - name: Verify production container lifecycle, signed backup, and restore
        run: npm run agent:container-lifecycle-gate -- --image obsidian-epoch-agent-server:ci

      - name: Verify hardened Caddy TLS proxy and security headers
        run: npm run agent:caddy-container-gate -- --upstream-image obsidian-epoch-agent-server:ci --caddy-image obsidian-epoch-caddy:ci
